services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      DATABASE_MODE: supabase
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set your Supabase Postgres connection string}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      DOCUMENT_ENCRYPTION_KEY_FILE: /run/secrets/document_keys
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    secrets:
      - document_keys

secrets:
  document_keys:
    file: ${DOCUMENT_ENCRYPTION_KEY_FILE:?Set an absolute path to your document encryption key file}
